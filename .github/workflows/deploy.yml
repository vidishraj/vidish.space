name: Deploy to Linux Server

on:
  push:
    branches:
      - Personal  # or your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Pull latest changes and restart service
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -euo pipefail
          cd /home/opc/React/vidish.space
          # ff-only: refuse to deploy if the checkout has diverged or is dirty,
          # instead of silently rebuilding stale code.
          # No sudo: the checkout is owned by the ssh user; pulling as root
          # would re-poison file ownership and break npm (EACCES).
          git pull --ff-only
          echo "Deploying commit: $(git rev-parse --short HEAD)"
          npm i
          npm run build
          # Only replace the live docroot after a successful build
          sudo rm -r /var/www/vidish/
          sudo mv dist/ /var/www/vidish/
        EOF
